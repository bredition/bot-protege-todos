<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contato via WhatsApp — Protege TODOS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>Quer se tornar um Afiliado?</h1>
      <p class="subtitle">Fale comigo no WhatsApp e eu te explico como funciona o Programa de Afiliados Protege TODOS.</p>

      <!-- Botão principal (troque o número no script.js) -->
      <div class="cta-row">
        <button id="wa-open" class="btn btn-primary" aria-label="Abrir WhatsApp">
          💬 Falar no WhatsApp
        </button>

        <!-- opcional: permite a pessoa enviar uma mensagem personalizada antes de abrir -->
        <input id="prefill" class="input" type="text" placeholder="Digite sua mensagem (opcional)" />
      </div>

      <p class="note">Ao clicar, o WhatsApp abrirá em uma nova aba ou no app do celular.</p>
    </div>
  </header>

  <!-- Botão flutuante no canto inferior direito -->
  <button id="wa-float" class="wa-float" title="Abrir WhatsApp">💬</button>

  <script src="script.js" defer></script>
</body>
</html>
